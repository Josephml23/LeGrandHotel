; Producción: sin errores en pantalla y con límites que evitan peticiones colgadas.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
; Tiempo máximo por petición (el plan pide 10 s en Nginx y PHP).
max_execution_time = 10
default_socket_timeout = 5
upload_max_filesize = 8M
post_max_size = 8M

; OPcache (EXTRA del 100%: uso de recursos del servidor).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

session.cookie_httponly = 1
session.cookie_secure = 1
