; Configuración completa de PHP-FPM para Render (global + pool), porque el contenedor corre como
; www-data y no puede escribir en /usr/local/etc: start.sh la arma en /tmp y la pasa con `php-fpm -y`.
[global]
daemonize = no
error_log = /dev/stderr

[www]
listen = 127.0.0.1:9000
; IMPRESCINDIBLE: sin esto PHP-FPM borra el entorno y Laravel no vería las variables de Render
; (la imagen no lleva .env: toda la configuración llega por variables de entorno).
clear_env = no

; En Render la instancia es pequeña (la gratuita tiene 512 MB): con ~40 MB por proceso, 5 workers
; caben de sobra. start.sh reemplaza __WORKERS__ por $PHP_FPM_WORKERS si cambias de plan.
pm = dynamic
pm.max_children = __WORKERS__
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Corta cualquier petición que pase de 30 s (el mismo límite que Nginx).
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
