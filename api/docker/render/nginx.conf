# Nginx de la imagen de Render: escucha en el puerto que entrega Render y pasa el PHP a PHP-FPM
# en el mismo contenedor. start.sh reemplaza __PORT__ antes de arrancar.
# Los logs van a la salida estándar porque en Render el disco es efímero y los recoge la plataforma.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Carpetas temporales en /tmp: el contenedor corre como www-data y no escribe en /var.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 8m;
    server_tokens off;
    gzip on;
    gzip_types application/json text/css application/javascript;

    server {
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_connect_timeout 3s;
            fastcgi_send_timeout 30s;
            # 30 s y no 10 como en AWS: la instancia gratuita de Render es mucho más lenta
            # y arranca en frío después de 15 minutos sin visitas.
            fastcgi_read_timeout 30s;
        }

        # Si PHP-FPM no responde, el usuario recibe el mismo JSON de 503 que da la API.
        error_page 502 503 504 = @unavailable;
        location @unavailable {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"El servicio no responde. Reintenta en 30 segundos.","details":{"retry_after":30}}}';
        }
    }
}
