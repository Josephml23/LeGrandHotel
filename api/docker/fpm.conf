[www]
; t3.small (2 GB): ~40 MB por proceso → 20 workers dejan margen para el sistema.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
; Corta cualquier petición que pase de 10 s (caída controlada en vez de colgarse).
request_terminate_timeout = 10s
pm.status_path = /fpm-status
catch_workers_output = yes
decorate_workers_output = no
