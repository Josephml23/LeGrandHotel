# EXTRA del 100%: cada pull request pasa estilo, análisis, pruebas y auditorías antes de fusionarse.
name: CI

on:
  pull_request:
  workflow_call: # deploy.yml lo llama en cada push a main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pint, PHPStan, Pest, composer audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, bcmath, intl, redis
          coverage: pcov
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Estilo (Pint)
        run: vendor/bin/pint --test
      - name: Análisis estático (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pruebas (Pest) con reporte de cobertura (meta sugerida 70%)
        run: vendor/bin/pest --coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
      - name: Vulnerabilidades de dependencias
        run: composer audit

  web:
    name: Web (ESLint, tipos, Vitest, npm audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Vulnerabilidades de dependencias (altas y críticas)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run build

  semgrep:
    name: Seguridad (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: semgrep scan --config p/php --config p/owasp-top-ten --config p/typescript --config p/react --config p/secrets --error --exclude api/vendor --exclude web/node_modules --exclude .claude --exclude api/.claude

  k6-lint:
    name: Scripts k6 (sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
      - run: k6 inspect tests/k6/reservas.js && k6 inspect tests/k6/smoke.js
