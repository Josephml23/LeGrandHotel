# Nginx delante de PHP-FPM. El ALB termina HTTPS y reenvía a este puerto 80.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 8m;

    # Tiempos máximos: ninguna petición queda colgada más de 10 s.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 10s;
        fastcgi_read_timeout 10s;
    }

    # Si PHP-FPM no responde, el usuario recibe el mismo JSON de 503 que la API.
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"El servicio no responde. Reintenta en 30 segundos.","details":{"retry_after":30}}}';
    }

    location ~ /\.(?!well-known) { deny all; }
}
