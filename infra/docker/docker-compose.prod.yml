# Producción en cada EC2 del Auto Scaling Group. La BD es RDS y la caché/colas ElastiCache:
# aquí solo corren Nginx, PHP-FPM, el worker de colas y el scheduler.
# Las variables se generan en /opt/legrandhotel/.env desde SSM (infra/scripts/load-ssm-env.sh).

x-api: &api
  image: ${API_IMAGE:?define API_IMAGE=<cuenta>.dkr.ecr.us-east-1.amazonaws.com/legrandhotel-api:<tag>}
  env_file: /opt/legrandhotel/.env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  volumes:
    - api-logs:/var/www/html/storage/logs

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - api-public:/var/www/html/public:ro
    depends_on:
      - app

  app:
    <<: *api
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - api-logs:/var/www/html/storage/logs
      - api-public:/var/www/html/public

  worker:
    <<: *api
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600

  scheduler:
    <<: *api
    command: php artisan schedule:work

volumes:
  # /var/lib/docker/volumes/legrandhotel_api-logs → lo lee el agente de CloudWatch.
  api-logs:
  api-public:
