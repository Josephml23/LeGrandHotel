# Despliegue en Render: API (Docker), web estática y PostgreSQL administrado.
# En Render: New → Blueprint → elige este repositorio. Crea los tres servicios de una vez.
#
# Después del primer despliegue hay que completar a mano, en el panel de cada servicio, las variables
# marcadas con `sync: false` (son secretos o direcciones que recién se conocen al crearse los servicios):
#   legrandhotel-api  → APP_KEY, FRONTEND_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, DEMO_PASSWORD
# La web no necesita ninguna: arma sola la dirección de la API.
# La guía paso a paso está en docs/despliegue-render.md.

databases:
  - name: legrandhotel-db
    databaseName: legrandhotel
    user: legrandhotel
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Laravel 12 en Docker: Nginx + PHP-FPM en un solo contenedor) ──
  - type: web
    name: legrandhotel-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile.render
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: LeGrandHotel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Se genera con: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: America/Lima
      - key: APP_LOCALE
        value: es

      # PostgreSQL: Render entrega la cadena de conexión completa y Laravel la entiende en DB_URL.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: legrandhotel-db
          property: connectionString

      # El disco de Render es efímero: los logs van a la salida estándar y los recoge la plataforma.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_REQUEST_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

      - key: SANCTUM_EXPIRATION
        value: "60"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_LOGIN
        value: "5"
      - key: RATE_LIMIT_REGISTER
        value: "3"
      - key: RATE_LIMIT_API
        value: "60"

      # Workers de PHP-FPM: 5 caben en los 512 MB del plan gratuito. Súbelo si cambias de plan.
      - key: PHP_FPM_WORKERS
        value: "5"
      # Corre las migraciones al arrancar. Déjalo en true: son idempotentes y el plan gratuito
      # levanta una sola instancia, así que no hay carrera entre contenedores.
      - key: RUN_MIGRATIONS
        value: "true"
      # Datos de demostración: ponlo en "true" una vez, espera el despliegue y vuelve a "false".
      # Es la única forma de sembrar en el plan gratuito, que no da consola.
      - key: RUN_SEED
        value: "false"

      # Dirección de la web (para CORS y para el regreso de Google): https://legrandhotel-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # GOOGLE_REDIRECT_URI no hace falta: sale de APP_URL, que start.sh toma de Render
      # (https://legrandhotel-api.onrender.com/api/v1/auth/google/callback). Eso sí, hay que
      # registrar esa misma dirección en Google Cloud Console.
      # Contraseña de las cuentas de demostración (solo si vas a sembrar datos de ejemplo).
      - key: DEMO_PASSWORD
        sync: false

  # ── Web (React + Vite, sitio estático) ──
  - type: web
    name: legrandhotel-web
    runtime: static
    rootDir: web
    # Dirección PÚBLICA de la API: la usa el navegador del visitante, así que va el dominio completo.
    # No sirve `fromService ... property: host`: eso devuelve el nombre interno (legrandhotel-api), que
    # solo resuelve dentro de la red de Render y el navegador no puede alcanzar.
    buildCommand: npm ci && VITE_API_URL="${VITE_API_URL:-https://legrandhotel-api.onrender.com/api/v1}" npm run build
    staticPublishPath: dist
    envVars:
      # Vite 8 necesita Node 20.19+ o 22.12+; sin fijarlo, Render podría construir con una versión vieja.
      - key: NODE_VERSION
        value: "22"
      - key: VITE_OBFUSCATE
        value: "true"
    routes:
      # React Router maneja las rutas en el navegador: todo lo que no sea un archivo va a index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
