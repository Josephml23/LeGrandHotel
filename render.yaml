# Despliegue en Render: API (Docker), web estática y PostgreSQL administrado.
# En Render: New → Blueprint → elige este repositorio. Crea los tres servicios de una vez.
#
# Después del primer despliegue hay que completar a mano, en el panel de cada servicio, las variables
# marcadas con `sync: false` (son secretos o direcciones que recién se conocen al crearse los servicios):
#   legrandhotel-api  → APP_KEY, FRONTEND_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI, DEMO_PASSWORD
#   legrandhotel-web  → VITE_API_URL
# La guía paso a paso está en docs/despliegue-render.md.

databases:
  - name: legrandhotel-db
    databaseName: legrandhotel
    user: legrandhotel
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Laravel 12 en Docker: Nginx + PHP-FPM en un solo contenedor) ──
  - type: web
    name: legrandhotel-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile.render
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: LeGrandHotel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Se genera con: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: America/Lima
      - key: APP_LOCALE
        value: es

      # PostgreSQL: Render entrega la cadena de conexión completa y Laravel la entiende en DB_URL.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: legrandhotel-db
          property: connectionString

      # El disco de Render es efímero: los logs van a la salida estándar y los recoge la plataforma.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_REQUEST_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

      - key: SANCTUM_EXPIRATION
        value: "60"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_LOGIN
        value: "5"
      - key: RATE_LIMIT_REGISTER
        value: "3"
      - key: RATE_LIMIT_API
        value: "60"

      # Workers de PHP-FPM: 5 caben en los 512 MB del plan gratuito. Súbelo si cambias de plan.
      - key: PHP_FPM_WORKERS
        value: "5"
      # Corre las migraciones al arrancar. Déjalo en true: son idempotentes y el plan gratuito
      # levanta una sola instancia, así que no hay carrera entre contenedores.
      - key: RUN_MIGRATIONS
        value: "true"

      # Dirección de la web (para CORS y para el regreso de Google): https://legrandhotel-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://legrandhotel-api.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Contraseña de las cuentas de demostración (solo si vas a sembrar datos de ejemplo).
      - key: DEMO_PASSWORD
        sync: false

  # ── Web (React + Vite, sitio estático) ──
  - type: web
    name: legrandhotel-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Dirección de la API, sin barra final: https://legrandhotel-api.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
      - key: VITE_OBFUSCATE
        value: "true"
    routes:
      # React Router maneja las rutas en el navegador: todo lo que no sea un archivo va a index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
